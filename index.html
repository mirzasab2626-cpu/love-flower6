<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08020a">
<title>Midnight Velvet Rose — Flower Animation</title>
<style>
:root{--bg:#08020a;--red:#ff174f;--rose:#b9003c;--pink:#ff668b;--gold:#ffd166}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif;background:var(--bg);color:#fff;overflow-x:hidden}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 75%,#31051c 0,#130510 42%,#050207 100%)}
#stars{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#ffd8e2;opacity:.65;animation:twinkle 3s infinite ease-in-out alternate}
@keyframes twinkle{from{opacity:.15;transform:scale(.7)}to{opacity:1;transform:scale(1.5)}}
.screen{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 18px}
#intro{transition:opacity .8s,transform .8s}
.greetings{display:flex;gap:.12em;font-family:Arial,sans-serif;font-size:clamp(3.2rem,12vw,7rem);font-weight:900;letter-spacing:.08em;color:#fff;text-shadow:0 0 8px #ff335f,0 0 25px #ed174e,0 0 60px #a30039}
.greetings span{display:inline-block;animation:hello 1.8s ease-in-out infinite alternate}
.greetings span:nth-child(2){animation-delay:.12s}.greetings span:nth-child(3){animation-delay:.24s}.greetings span:nth-child(4){animation-delay:.36s}.greetings span:nth-child(5){animation-delay:.48s}
@keyframes hello{to{transform:translateY(-8px);text-shadow:0 0 15px #fff,0 0 35px #ff174f}}
.subtitle{font-size:clamp(1.05rem,3.5vw,1.55rem);color:#ffd6e0;margin:25px 0 30px;letter-spacing:.04em}
button{font:700 1rem Arial,sans-serif;letter-spacing:.08em;border:1px solid #ff7c9b;border-radius:999px;padding:15px 34px;color:white;background:linear-gradient(135deg,#ff174f,#9b0036);box-shadow:0 0 22px #ff174f70;cursor:pointer;transition:transform .2s,box-shadow .2s}
button:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 32px #ff174f}
#garden{display:none;justify-content:flex-end;padding-top:40px;overflow:hidden}
.garden-title{font-size:clamp(1.5rem,5vw,2.5rem);color:#ffe2e9;text-shadow:0 0 20px #ff174f;margin:0 0 12px}
.hint{color:#eab7c5;font:14px Arial,sans-serif;margin:0 0 20px}
.bouquet{display:flex;align-items:flex-end;justify-content:center;gap:clamp(0px,2vw,24px);width:min(900px,100%);height:min(57vh,460px);min-height:280px;padding-bottom:12px}
.flower{position:relative;width:clamp(85px,18vw,160px);height:100%;cursor:pointer;animation:sway 4s ease-in-out infinite alternate;transform-origin:bottom center}
.flower:nth-child(2){animation-delay:-1.3s}.flower:nth-child(3){animation-delay:-2.4s}.flower:nth-child(4){animation-delay:-.8s}.flower:nth-child(5){animation-delay:-1.8s}\n.flower:nth-child(1){--delay:0s}.flower:nth-child(2){--delay:.05s}.flower:nth-child(3){--delay:.1s}.flower:nth-child(4){--delay:.15s}.flower:nth-child(5){--delay:.2s}\n.flower.open-again .bloom{animation:reBloom 1.2s ease-out}\n@keyframes reBloom{0%{transform:translateX(-50%) scale(.15) rotate(-25deg)}65%{transform:translateX(-50%) scale(1.08) rotate(6deg)}100%{transform:translateX(-50%) scale(1) rotate(0)}}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.stem{position:absolute;bottom:0;left:50%;width:5px;height:65%;transform:translateX(-50%);border-radius:8px;background:linear-gradient(90deg,#123e28,#39a85a,#0b301e)}
.leaf{position:absolute;width:42%;height:15%;bottom:30%;background:linear-gradient(135deg,#48b96a,#14532e);border-radius:100% 0 100% 0;box-shadow:0 0 8px #2d9b4c55}
.leaf.left{left:10%;transform:rotate(18deg)}.leaf.right{right:8%;bottom:42%;transform:rotate(75deg) scaleX(-1)}
.bloom{position:absolute;left:50%;top:23%;width:100%;aspect-ratio:1;transform:translateX(-50%) scale(1);opacity:1;filter:none;animation:bloomOpen 2.4s cubic-bezier(.18,.75,.25,1) forwards;animation-delay:var(--delay,0s);transition:filter .3s,transform .3s,opacity .3s}\n@keyframes bloomOpen{0%{transform:translateX(-50%) scale(.45) rotate(-12deg);opacity:1;filter:none}65%{transform:translateX(-50%) scale(1.08) rotate(4deg);opacity:1;filter:none}100%{transform:translateX(-50%) scale(1) rotate(0);opacity:1;filter:none}}
.petal{position:absolute;left:50%;top:50%;width:42%;height:60%;border-radius:70% 70% 45% 45%;transform-origin:50% 90%;animation:petalUnfold 2.0s cubic-bezier(.2,.8,.25,1) both;animation-delay:calc(var(--delay,0s) + var(--petal-delay,0s));background:radial-gradient(ellipse at 35% 25%,#ff91a9 0,#e20d48 30%,#780022 76%,#300012 100%);border:1px solid #ff77964a;box-shadow:inset -5px -8px 12px #28000b88,0 0 12px #f3154b28}
@keyframes petalUnfold{0%{opacity:1;filter:brightness(.8);scale:.72}55%{opacity:1;filter:brightness(1.15);scale:1.08}100%{opacity:1;filter:brightness(1);scale:1}}\n.petal:nth-child(1){--petal-delay:0s;transform:translate(-50%,-90%) rotate(0deg)}.petal:nth-child(2){--petal-delay:0.13s;transform:translate(-50%,-90%) rotate(45deg)}.petal:nth-child(3){--petal-delay:0.26s;transform:translate(-50%,-90%) rotate(90deg)}.petal:nth-child(4){--petal-delay:0.39s;transform:translate(-50%,-90%) rotate(135deg)}.petal:nth-child(5){--petal-delay:0.52s;transform:translate(-50%,-90%) rotate(180deg)}.petal:nth-child(6){--petal-delay:0.65s;transform:translate(-50%,-90%) rotate(225deg)}.petal:nth-child(7){--petal-delay:0.78s;transform:translate(-50%,-90%) rotate(270deg)}.petal:nth-child(8){--petal-delay:0.91s;transform:translate(-50%,-90%) rotate(315deg)}
.center{position:absolute;left:50%;top:50%;width:33%;height:33%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 25%,#ffb1bf,#df174c 45%,#65001e 85%);box-shadow:0 0 18px #ff2a5e}
.flower:hover .bloom{filter:brightness(1.25) drop-shadow(0 0 14px #ff2b61)}
.footer{color:#d7a1b1;font:12px Arial,sans-serif;margin:20px 0 0}
.modal{position:fixed;inset:0;z-index:5;background:#050007d9;display:none;align-items:center;justify-content:center;padding:20px}
.note{max-width:440px;width:100%;text-align:center;padding:35px 28px;border:1px solid #ff6e91;border-radius:22px;background:linear-gradient(145deg,#31051d,#100610);box-shadow:0 0 45px #ff174f45}
.note h2{color:#ffb5c8;margin-top:0}.note p{line-height:1.7;color:#ffe4eb}.note button{margin-top:10px}
#music{position:fixed;z-index:3;right:16px;top:16px;border-radius:50%;width:48px;height:48px;padding:0;font-size:20px;display:none}
#surprise{display:none;margin-top:14px}
.heart{position:fixed;z-index:4;pointer-events:none;animation:floatUp 1.5s ease-out forwards}
@keyframes floatUp{to{transform:translateY(-130px) rotate(25deg) scale(.2);opacity:0}}
@media(max-width:520px){.bouquet{gap:0;height:48vh}.flower{width:19vw}.stem{width:4px}.garden-title{margin-top:20px}.screen{padding-left:10px;padding-right:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="stars" aria-hidden="true"></div>
<button id="music" aria-label="Toggle music" title="Music on/off">♫</button>
<main>
<section id="intro" class="screen">
  <div class="greetings" aria-label="Hello"><span>H</span><span>E</span><span>L</span><span>L</span><span>O</span></div>
  <p class="subtitle">I have a special gift for you! 🌹</p>
  <button id="open">CLICK ME ✨</button>
</section>
<section id="garden" class="screen">
  <h1 class="garden-title">A Garden Just for You 🌹</h1>
  <p class="hint">Tap a rose to open a little secret note</p>
  <div class="bouquet" aria-label="Animated roses">
    <div class="flower" data-note="Some people make the world brighter just by being in it. You are one of them. 💖"><div class="stem"></div><i class="leaf left"></i><i class="leaf right"></i><div class="bloom"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="center"></i></div></div>
    <div class="flower" data-note="If I could give you one thing, it would be the ability to see yourself through my eyes. 🌷"><div class="stem"></div><i class="leaf left"></i><i class="leaf right"></i><div class="bloom"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="center"></i></div></div>
    <div class="flower" data-note="You deserve soft days, kind people, peaceful nights, and all the beautiful things life can offer. ✨"><div class="stem"></div><i class="leaf left"></i><i class="leaf right"></i><div class="bloom"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="center"></i></div></div>
    <div class="flower" data-note="No matter how far apart people are, a sincere thought can make them feel close. ❤️"><div class="stem"></div><i class="leaf left"></i><i class="leaf right"></i><div class="bloom"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="center"></i></div></div>
    <div class="flower" data-note="This little garden is a reminder that you are appreciated more than words can say. 🌹"><div class="stem"></div><i class="leaf left"></i><i class="leaf right"></i><div class="bloom"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="center"></i></div></div>
  </div>
  <button id="surprise">ONE LAST SURPRISE 💌</button>
  <p class="footer">Made with love, just for you ✨</p>
</section>
</main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="noteTitle">
  <div class="note"><h2 id="noteTitle">A little note for you 💌</h2><p id="noteText"></p><button id="close">CLOSE</button></div>
</div>
<script>
const starBox=document.getElementById('stars');
for(let i=0;i<90;i++){const s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=(Math.random()*4)+'s';s.style.animationDuration=(2+Math.random()*4)+'s';starBox.appendChild(s)}
const intro=document.getElementById('intro'),garden=document.getElementById('garden'),musicBtn=document.getElementById('music');
document.getElementById('open').addEventListener('click',()=>{intro.style.display='none';garden.style.display='flex';musicBtn.style.display='block';document.getElementById('surprise').style.display='inline-block';document.querySelectorAll('.bloom').forEach((b,i)=>{b.style.animation='none';void b.offsetWidth;b.style.animation='';b.style.setProperty('--delay',(i*0.16)+'s')});window.scrollTo({top:0,behavior:'smooth'});burst(innerWidth/2,innerHeight/2)});
const modal=document.getElementById('modal'),noteText=document.getElementById('noteText');
document.querySelectorAll('.flower').forEach(f=>f.addEventListener('click',()=>{f.classList.remove('open-again');void f.offsetWidth;f.classList.add('open-again');noteText.textContent=f.dataset.note;modal.style.display='flex';burst(innerWidth/2,innerHeight/2)}));
document.getElementById('close').addEventListener('click',()=>modal.style.display='none');
modal.addEventListener('click',e=>{if(e.target===modal)modal.style.display='none'});
document.getElementById('surprise').addEventListener('click',()=>{noteText.textContent='You are a beautiful part of this world. Never forget how special you are. Sending you a garden full of love! 💖🌹✨';document.getElementById('noteTitle').textContent='One Last Surprise 💖';modal.style.display='flex';for(let i=0;i<30;i++)setTimeout(()=>burst(Math.random()*innerWidth,innerHeight*.75),i*45)});
function burst(x,y){for(let i=0;i<7;i++){const h=document.createElement('span');h.className='heart';h.textContent=['❤️','💖','💕','🌹','✨'][Math.floor(Math.random()*5)];h.style.left=(x+(Math.random()-.5)*100)+'px';h.style.top=(y+(Math.random()-.5)*50)+'px';h.style.fontSize=(14+Math.random()*16)+'px';document.body.appendChild(h);setTimeout(()=>h.remove(),1600)}}
document.addEventListener('pointerdown',e=>{if(garden.style.display==='flex'&&e.target.tagName!=='BUTTON'&&!e.target.closest('.note'))burst(e.clientX,e.clientY)}, {passive:true});
// Browsers block autoplay without a supplied audio file. This standalone file intentionally works without external assets.
let musicOn=false;musicBtn.addEventListener('click',()=>{musicOn=!musicOn;musicBtn.textContent=musicOn?'♫̸':'♫';musicBtn.title=musicOn?'Music unavailable in the standalone file':'Music on/off';if(musicOn){musicBtn.textContent='♪';setTimeout(()=>{musicOn=false;musicBtn.textContent='♫'},700)}});
</script>
</body>
</html>
